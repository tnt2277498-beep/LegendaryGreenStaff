plugins {
id 'eclipse'
id 'idea'
id 'maven-publish'
id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'ru.thekai.legendarygreenstaff'
archivesBaseName = 'legendarygreenstaff'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
mappings channel: 'official', version: '1.20.1'

runs {
    configureEach {
        workingDirectory project.file('run')
        property 'forge.logging.console.level', 'info'
        mods {
            legendarygreenstaff {
                source sourceSets.main
            }
        }
    }
}

}

dependencies {
minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('processResources', ProcessResources).configure {
var replaceProperties = [
mod_id: 'legendarygreenstaff',
mod_name: 'Legendary Green Staff',
mod_version: '1.0.0',
mod_authors: 'TheKai',
mod_description: 'A legendary green magic staff with RPG progression.'
]

inputs.properties replaceProperties
filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
    expand replaceProperties
}

}

tasks.withType(JavaCompile).configureEach {
options.encoding = 'UTF-8'
}

jar {
manifest {
attributes([
'Specification-Title': 'legendarygreenstaff',
'Specification-Vendor': 'TheKai',
'Specification-Version': '1',
'Implementation-Title': project.name,
'Implementation-Version': project.jar.archiveVersion
])
}
}
